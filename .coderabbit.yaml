# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit configuration for gopay.
# Docs: https://docs.coderabbit.ai/getting-started/configure-coderabbit
language: en-US
early_access: false
tone_instructions: >-
  Be concise and direct. This is a payment-processing library, so prioritize
  correctness, security, and API stability over style nits.

reviews:
  # "assertive" gives stricter, more thorough reviews; switch to "chill" for fewer, higher-signal comments.
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  poem: true
  review_status: true
  # Report review status as a GitHub commit status, but never fail the build.
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: false
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_reviewers: true
  suggested_labels: true
  auto_apply_labels: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
    # Skip release/automation PRs that don't need a human-style review.
    ignore_title_keywords:
      - "wip"
      - "release"
    ignore_usernames:
      - "dependabot[bot]"

  # Let the bot offer docstrings and test scaffolding, but not auto-simplify.
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true

  # Files CodeRabbit should ignore (generated/vendored/lock files add noise).
  path_filters:
    - "!**/go.sum"
    - "!**/go.work.sum"
    - "!**/*.pb.go"
    - "!**/mock.go"
    - "!**/node_modules/**"
    - "!**/package-lock.json"
    # Frozen snapshots of website/docs taken at release time. A docs change
    # lands in website/docs only — snapshots are produced by cut-version and
    # are never hand-edited, so any suggestion here is unactionable by
    # definition: a published snapshot documents the behaviour of a shipped
    # version, and changing it rewrites history for users still on it.
    - "!website/versioned_docs/**"
    - "!website/versioned_sidebars/**"
    # Generated raster assets and the logo SVGs; nothing to review as text.
    - "!website/static/**"

  # Targeted, path-scoped guidance for the reviewer.
  path_instructions:
    - path: "**/*.go"
      instructions: >-
        Follow standard Go conventions and Effective Go. Always check and handle
        returned errors; flag ignored errors and unwrapped error returns. Ensure
        functions that perform I/O accept and honor a context.Context. Require
        doc comments on exported types, functions, and methods. Flag any logging,
        printing, or error message that could leak secrets such as API keys,
        tokens, card numbers, CVV, or full PII.
    - path: "{payment,list,setupintent,subscription,invoice}.go"
      instructions: >-
        This is the core public API. Treat changes to exported types, function
        signatures, and interfaces as potentially breaking — call out any
        backward-incompatible change explicitly. Verify input validation on
        amounts, currencies, and identifiers.
    - path: "{stripe,paypal,razorpay}/*.go"
      instructions: >-
        Payment provider adapters. Verify HTTP clients set timeouts, response
        bodies are closed, idempotency keys are used for charge/refund calls
        where the provider supports them, and provider secrets are never logged.
        Confirm error responses from the provider are mapped to gopay's error
        types rather than swallowed. Two bug classes have recurred here and
        need explicit re-checking on any touching change: (1) webhook
        signature header lookups (Stripe-Signature, X-Razorpay-Signature,
        PAYPAL-*) must be case-insensitive, and signature comparison must be
        constant-time; (2) code converting between a major-unit decimal
        string (PayPal amounts) and a minor-unit integer Amount must preserve
        the sign explicitly when the whole-number part is zero (e.g. -0.99),
        not derive it from that now-zero whole part.
    - path: "**/*_test.go"
      instructions: >-
        Prefer table-driven tests. Check that error paths and edge cases (zero
        amounts, invalid currencies, network failures) are covered. Tests must
        not contain real API keys or live network calls.
    - path: "website/docs/**"
      instructions: >-
        Docusaurus source for the unreleased docs. Verify every Go snippet
        compiles against the current API and that option/type names match the
        exported identifiers exactly — a wrong name here is a support burden,
        not a typo. This site is versioned by snapshot, not per release:
        additive changes are marked inline instead of being snapshotted, so
        check that anything documenting a new API carries its version marker
        — `_0.9+_` appended to an API table's description cell,
        `_Added in 0.9._` opening a prose paragraph, or a trailing `// 0.9+`
        comment inside a code block. Behaviour that changed takes
        `_Changed in 0.9._` plus a line on what it was before. See
        website/VERSIONING.md rules 1 and 2. Do not suggest edits to
        website/versioned_docs; those are frozen release snapshots.

  tools:
    # Reuse the repo's existing golangci-lint configuration (.golangci.yml).
    golangci-lint:
      enabled: true
    # Secret scanning — important for a library that handles provider credentials.
    gitleaks:
      enabled: true
    # Lint GitHub Actions workflows and Markdown docs.
    actionlint:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto
  web_search:
    enabled: true
