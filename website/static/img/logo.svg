<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="gopay">
  <title>gopay</title>

  <!-- ears (deeper shade, peeking from behind the head) -->
  <circle cx="68.3" cy="58.2" r="24" fill="#1D9BCB"/>
  <circle cx="131.7" cy="58.2" r="24" fill="#1D9BCB"/>

  <!-- head -->
  <circle cx="100" cy="96" r="58" fill="#29B6E8"/>

  <!-- eyes -->
  <circle cx="74" cy="88" r="19" fill="#fff"/>
  <circle cx="126" cy="88" r="19" fill="#fff"/>
  <circle cx="77" cy="91" r="7.5" fill="#111827"/>
  <circle cx="129" cy="91" r="7.5" fill="#111827"/>
  <circle cx="80" cy="86" r="2.2" fill="#fff"/>
  <circle cx="132" cy="86" r="2.2" fill="#fff"/>

  <!-- muzzle + teeth -->
  <ellipse cx="100" cy="116" rx="30" ry="22" fill="#FAFBFC" stroke="#D9E2EC" stroke-width="1.4"/>
  <rect x="93" y="130" width="7" height="8" rx="2" fill="#fff" stroke="#111827" stroke-width="1.3"/>
  <rect x="101" y="130" width="7" height="8" rx="2" fill="#fff" stroke="#111827" stroke-width="1.3"/>

  <!-- paws -->
  <ellipse cx="56" cy="148" rx="17" ry="20" fill="#1D9BCB"/>
  <ellipse cx="144" cy="148" rx="17" ry="20" fill="#1D9BCB"/>

  <!-- payment card -->
  <rect x="48" y="138" width="104" height="52" rx="9" fill="#1B2A4A"/>
  <rect x="58" y="151" width="84" height="11" rx="2" fill="#64748B"/>
  <circle cx="117" cy="172" r="10" fill="#22C55E" opacity="0.92"/>
  <circle cx="130" cy="172" r="10" fill="#16A34A" opacity="0.92"/>

  <!-- motion lines -->
  <rect x="162" y="148" width="26" height="9" rx="4.5" fill="#22C55E"/>
  <rect x="162" y="164" width="20" height="9" rx="4.5" fill="#22C55E"/>
  <rect x="162" y="180" width="14" height="9" rx="4.5" fill="#22C55E"/>
</svg>
