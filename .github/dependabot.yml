version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(core)"
    labels:
      - dependencies
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /stripe
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(stripe)"
    labels:
      - dependencies
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /paypal
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(paypal)"
    labels:
      - dependencies
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /razorpay
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(razorpay)"
    labels:
      - dependencies
    open-pull-requests-limit: 5

  # The documentation site. Grouped on purpose: Docusaurus pulls in a large
  # transitive tree, and ungrouped weekly updates would bury the Go module PRs
  # that actually affect what users import. Two PRs a week at most — the Docs
  # workflow builds the site on each one, so a bad bump fails before merge.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(website)"
    labels:
      - dependencies
    open-pull-requests-limit: 3
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
          - "@mdx-js/*"
      website:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - ci
    open-pull-requests-limit: 5
