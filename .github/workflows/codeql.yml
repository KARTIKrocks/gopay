name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  security-events: write
  contents: read

# Supersede an in-flight run when a PR is pushed to again. Scheduled and main
# runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.24"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go

      - name: Use local root module in sub-modules
        run: |
          for mod in stripe paypal razorpay; do
            (cd $mod && go mod edit -replace github.com/KARTIKrocks/gopay=../)
          done

      - name: Build all modules
        run: |
          go build ./...
          cd stripe && go build ./... && cd ..
          cd paypal && go build ./... && cd ..
          cd razorpay && go build ./... && cd ..

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
