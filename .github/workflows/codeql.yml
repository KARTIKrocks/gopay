name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# Supersede an in-flight run when a PR is pushed to again. Scheduled and main
# runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Scanned per module for the same reason `lint` and `vuln` in ci.yml are: the
  # root module's ./... stops at nested go.mod boundaries, so a single build
  # from the root extracts no code at all from the provider sub-modules.
  #
  # `category` must differ per module. CodeQL keys uploaded results by it, so
  # without it each module's results would overwrite the previous module's and
  # the security tab would only ever show whichever job finished last.
  analyze:
    name: Analyze (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [".", "./stripe", "./paypal", "./razorpay"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      # `source-root` scopes extraction to this module's directory. The provider
      # jobs build against the root module's local source (below), and without
      # this the root's files would sit inside the source root and be extracted
      # by every job, reporting each root-module finding four times over. With
      # it, ../ is outside the source root, so only the "." job scans the root.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: go
          source-root: ${{ matrix.module }}

      # Built through the committed go.work (see its header comment), so each
      # provider compiles against the root module's working tree, as in ci.yml.
      # Building against the pinned gopay release instead (GOWORK=off) fails
      # every PR that adds root API and uses it from a provider: the providers
      # can only require that API once it has been released.
      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.1
        with:
          category: "/language:go/module:${{ matrix.module }}"
